const ROOM_API = '/api/rooms';

function randomSeed() {
 return crypto.getRandomValues(new Uint32Array(1))[0];
}

function loadSoloLibrary() {
 let saved = {};
 try { saved = JSON.parse(localStorage.getItem(SOLO_STORAGE_KEY) || '{}'); } catch { /* Storage is optional. */ }
 const library = {
  activeMode: saved.activeMode === 'challenge' ? 'challenge' : 'campaign',
  campaign: LightPuzzle.initialPuzzle(),
  challenge: LightPuzzle.initialPuzzle({mode: 'challenge', seed: randomSeed()}),
 };
 for (const mode of ['campaign', 'challenge']) {
  try {
   const candidate = LightPuzzle.migratePuzzle(saved[mode]);
   if (candidate.mode === mode) library[mode] = candidate;
  } catch { /* Keep the valid initial state when an old save cannot be read. */ }
 }
 return library;
}

function saveSoloProgress() {
 if (connection || ranked || tutorial) return;
 soloLibrary[puzzle.mode] = structuredClone(puzzle);
 soloLibrary.activeMode = puzzle.mode;
 const unlocked = Math.max(soloLibrary.campaign.unlocked, soloLibrary.challenge.unlocked);
 const completed = soloLibrary.campaign.completed | soloLibrary.challenge.completed;
 soloLibrary.campaign.completed = completed;
 soloLibrary.challenge.completed = completed;
 soloLibrary.campaign.unlocked = unlocked;
 soloLibrary.challenge.unlocked = unlocked;
 try { localStorage.setItem(SOLO_STORAGE_KEY, JSON.stringify(soloLibrary)); } catch { /* The current session remains playable. */ }
}

function puzzleIdentity(state) {
 return [state.mode, state.levelIndex, state.seed].join(':');

function puzzleConfig() {
 return LightPuzzle.getPuzzleConfig(puzzle);
}

function canChangeLevel() {
 return !tutorial && !ranked && !roomControlsLocked() && (!connection || isHost());
}

function getSession(key) {
 try { return sessionStorage.getItem(key); } catch { return null; }
}

function setSession(key, value) {
 try {
  if (value === null) sessionStorage.removeItem(key);
  else sessionStorage.setItem(key, value);
 } catch { /* Private browsing can limit session storage. */ }
}

function storedRoom(code) {
 if (!ROOM_CODE.test(code)) return null;
 try {
  const saved = JSON.parse(getSession(SESSION_PREFIX + code));
  return typeof saved?.token === 'string' && typeof saved?.name === 'string' ? saved : null;
 } catch { return null; }
}

}

function errorText(key) {

}

 for (const id of ['room-create','room-join','room-code','room-name','begin','open-lobby']) {

 const status = get('lobby-status');

 if (code !== null) get('room-code').value = code;
 get('room-lobby').hidden = false;
 get('open-lobby').setAttribute('aria-expanded', 'true');
 if (!/^https?:$/.test(location.protocol)) lobbyNotice = 'file_origin';
 renderLobby();
 if (focus) get(storedRoom(roomCodeInput()) ? 'room-join' : 'room-name').focus();
}

class RoomRequestError extends Error {
 constructor(key, status = 0) {
  super(key);
  this.key = key;
  this.status = status;
 }
}

async function requestRoom(path = '', {token, body} = {}) {
 const headers = {};
 if (token) headers.Authorization = `Bearer ${token}`;
 if (body) headers['Content-Type'] = 'application/json';
 const controller = new AbortController();
 const timeout = setTimeout(() => controller.abort(), 9000);
 try {
  let response;
  try {
   response = await fetch(ROOM_API + path, {
    method: body ? 'POST' : 'GET',
    body: body ? JSON.stringify(body) : undefined,
    headers,
    cache: 'no-store',
    signal: controller.signal,
   });
  } catch { throw new RoomRequestError('network'); }
  const payload = await response.json().catch(() => null);
  if (!response.ok) throw new RoomRequestError(payload?.error || 'service_unavailable', response.status);
  if (body?.type !== 'leave' && (!ROOM_CODE.test(payload?.room?.code ?? '') || typeof payload.playerId !== 'string')) {
   throw new RoomRequestError('service_unavailable');
  }
  return payload;
 } finally {
  clearTimeout(timeout);
 }
}

function isHost(active = connection) {
 return Boolean(active?.room?.players.find(player => player.id === active.playerId)?.isHost);
}

function roomControlsLocked() {
 return Boolean(ranked?.busy || connection && (connection.busy || !connection.connected));
}

function resetPersonalViews() {
 sceneIndex = 0;
 lensViews = freshViews();
 hintLevels = [0,0,0];

}

function renderRoomBar() {

 const status = active.connected ? `${t.onlineState} · ${t.playerCount(room.players.length)}` : t.offlineState;
 if (state.textContent !== status) state.textContent = status;
 state.toggleAttribute('data-offline', !active.connected);
 const roster = get('room-roster');
 roster.setAttribute('aria-label', t.roster);
 const members = room.players.map(player => {
  const item = document.createElement('li');
  item.textContent = player.name;
  for (const tag of [player.isHost ? t.host : '', player.id === active.playerId ? t.you : '']) {
   if (!tag) continue;
   const badge = document.createElement('span');
   badge.className = 'player-tag';
   badge.textContent = tag;
   item.append(badge);
  }
  return item;
 });
 roster.replaceChildren(...members);
 const link = get('invite-link');
 if (link.value !== active.invite) link.value = active.invite;
 const notice = get('room-notice');
 const noticeText = active.error ? errorText(active.error) : active.notice ? t[active.notice] : '';
 notice.hidden = !noticeText;
 notice.classList.toggle('room-error', Boolean(active.error));
 if (notice.textContent !== noticeText) notice.textContent = noticeText;
}

function showRoomResult() {
 const active = connection;
 if (!active || phase !== 'game' || !puzzle.solved || replay.playing || get('modal').open) return;
 if (active.announcedRound === active.room.round) return;
 active.announcedRound = active.room.round;
 showModal('solved');
}

function acceptRoomSnapshot(active, room) {
 if (connection !== active || room.code !== active.code) return false;
 const previous = active.room;
 if (previous && (room.revision <= previous.revision || room.round < previous.round)) return false;
 const newRound = previous && (room.round !== previous.round || puzzleIdentity(room.puzzle) !== puzzleIdentity(previous.puzzle));
 const next = room.puzzle ? structuredClone(room.puzzle) : LightPuzzle.initialPuzzle();
 const sameRoster = previous && JSON.stringify(previous.players) === JSON.stringify(room.players);
 const newAttempt = next.attempt && (!previous?.puzzle?.attempt ||
  JSON.stringify(next.attempt) !== JSON.stringify(previous.puzzle.attempt) ||
  sameRoster && JSON.stringify(next) === JSON.stringify(previous.puzzle));
 if (newRound) {
  active.announcedRound = null;
  resetPersonalViews();
  active.error = null;
  active.notice = null;
  if (modalType === 'solved' && get('modal').open) get('modal').close();
 }
 active.room = room;
 puzzle = next;
 if (!puzzle.attempt) stopReplay();
 if (phase === 'game') {
  renderGame();
  renderRoomBar();
  if (newAttempt) beginReplay();
  else showRoomResult();
 }
 return true;
}

function detachRoom(forget = false) {
 const active = connection;
 if (!active) return;
 connection = null;
 clearTimeout(active.pollTimer);
 if (forget) {
  setSession(SESSION_PREFIX + active.code, null);
  setRoomAddress(null);
 }
 if (get('modal').open) {
  get('modal').returnValue = '';
  modalType = null;
  get('modal').close();
 }
 stopReplay();
 ({sceneIndex, lensViews, hintLevels, puzzle, soloOutcomeShown} = savedSoloState);
 savedSoloState = null;
 drag = null;
 get('room-bar').hidden = true;
}

function setRoomConnected(active, value) {
 if (connection !== active || active.connected === value) return;
 active.connected = value;
 if (value) active.error = null;
 renderRoomBar();
 renderGame();
 requestDraw();
}

function roomSessionEnded(error) {
 return [401, 404, 410].includes(error.status);
}

function reportRoomError(active, error) {
 if (connection !== active) return;
 if (roomSessionEnded(error)) {
  if (active.leaving) {
   finishLeavingRoom();
   return;
  }
  detachRoom(true);
  lobbyNotice = error.key;
  showHome();
  openLobby(active.code, false);
  return;
 }
 active.error = error.key || 'service_unavailable';
 if (['network','service_unavailable'].includes(error.key) || error.status >= 500) setRoomConnected(active, false);
 renderRoomBar();
}

async function refreshRoom(active) {
 if (connection !== active || active.refreshing) return;
 active.refreshing = true;
 try {
  const payload = await requestRoom(`/${active.code}`, {token: active.token});
  if (connection !== active) return;
  setRoomConnected(active, true);
  acceptRoomSnapshot(active, payload.room);
 } catch (error) {
  reportRoomError(active, error);
 } finally {
  active.refreshing = false;
 }
}

function scheduleRoomPoll(active) {
 if (connection !== active) return;
 active.pollTimer = setTimeout(async () => {
  await refreshRoom(active);
  scheduleRoomPoll(active);
 }, 1500);
}

function enterRoom(payload, token, name) {
 const {room, playerId} = payload;
 const invite = new URL(location.pathname, location.origin);
 invite.searchParams.set('room', room.code);
 const active = {
  code: room.code, token, playerId, room: null, invite: invite.href,
  connected: true, busy: false, refreshing: false, leaving: false, pollTimer: null,
  announcedRound: null, notice: null, error: null,
 };
 savedSoloState = {sceneIndex, lensViews, hintLevels, puzzle, soloOutcomeShown};
 connection = active;
 resetPersonalViews();
 acceptRoomSnapshot(active, room);
 setSession(SESSION_PREFIX + room.code, JSON.stringify({token, name}));
 setRoomAddress(room.code);
 get('room-code').value = room.code;
 showGame();
 if (puzzle.attempt) beginReplay();
 renderRoomBar();
 showRoomResult();
 scheduleRoomPoll(active);
}

async function submitRoom(action) {
 if(ranked) exitRanked();
 if(!get("room-name").value.trim())get("room-name").value=playerNickname();
 if (lobbyBusy || connection || tutorial || ranked) return;
 const code = roomCodeInput();
 const saved = action === 'join' ? storedRoom(code) : null;
 const name = (saved?.name || get('room-name').value).normalize('NFC').trim();
 lobbyNotice = null;
 if (!/^https?:$/.test(location.protocol)) lobbyNotice = 'file_origin';
 else if (action === 'join' && !ROOM_CODE.test(code)) lobbyNotice = 'invalid_room_code';
 else if (!saved && (!name || [...name].length > 24 || /[\u0000-\u001f\u007f-\u009f]/u.test(name))) lobbyNotice = 'invalid_name';
 if (lobbyNotice) {
  renderLobby();
  if (lobbyNotice === 'invalid_name') get('room-name').focus();
  if (lobbyNotice === 'invalid_room_code') get('room-code').focus();
  return;
 }
 lobbyBusy = true;
 renderLobby();
 try {
  const payload = saved ? await requestRoom(`/${code}`, {token: saved.token}) :
   await requestRoom(action === 'create' ? '' : `/${code}/join`, {body: {name}});
  const token = saved?.token ?? payload.token;
  if (typeof token !== 'string') throw new RoomRequestError('service_unavailable');
  get('room-name').value = name;
  enterRoom(payload, token, name);
 } catch (error) {
  if (saved && roomSessionEnded(error)) setSession(SESSION_PREFIX + code, null);
  lobbyNotice = error.key || 'service_unavailable';
 } finally {
  lobbyBusy = false;
  renderLobby();
 }
}

async function roomAction(type, fields = {}) {
 const active = connection;
 if (!active || roomControlsLocked()) return;
 active.busy = true;
 active.error = null;
 active.notice = null;
 renderRoomBar();
 renderGame();
 requestDraw();
 try {
  const {room} = await requestRoom(`/${active.code}/action`, {
   token: active.token,
   body: {type, round: active.room.round, ...(type === 'puzzle' ? {expectedRevision: active.room.revision} : {}), ...fields},
  });
  acceptRoomSnapshot(active, room);
 } catch (error) {
  reportRoomError(active, error);
  await refreshRoom(active);
 } finally {
  active.busy = false;
  if (connection === active) {
   renderRoomBar();
   renderGame();
   requestDraw();
  }
 }
}

function finishLeavingRoom() {
 detachRoom(true);
 lobbyNotice = null;
 get('room-code').value = '';
 get('room-lobby').hidden = true;
 get('open-lobby').setAttribute('aria-expanded', 'false');
 showHome();
 get('open-lobby').focus();
}

async function leaveRoom() {
 const active = connection;
 if (!active || active.busy) return;
 active.busy = true;
 active.leaving = true;
 active.error = null;
 active.notice = null;
 renderRoomBar();
 renderGame();
 requestDraw();
 try {
  await requestRoom(`/${active.code}/action`, {token: active.token, body: {type: 'leave', round: active.room.round}});
  if (connection === active) finishLeavingRoom();
 } catch (error) {
  if (connection !== active) return;
  if (roomSessionEnded(error)) finishLeavingRoom();
  else if (error.key === 'network' || error.status >= 500) {
   active.notice = 'leaveRetry';
   setRoomConnected(active, false);
  } else {
   reportRoomError(active, error);
   await refreshRoom(active);
  }
 } finally {
  active.busy = false;
  active.leaving = false;
  if (connection === active) {
   renderRoomBar();
   renderGame();
   requestDraw();
  }
 }
}

async function copyRoomInvite() {
 const active = connection;
 if (!active) return;
 try {
  await navigator.clipboard.writeText(active.invite);
  if (connection !== active) return;
  active.notice = 'inviteCopied';
 } catch {
  if (connection !== active) return;
  const input = get('invite-link');
  input.focus();
  input.select();
  active.notice = 'inviteSelected';
 }
 active.error = null;
 renderRoomBar();
}

 if(!tutorial)return true;

 return step===0&&action.type==='capture'&&action.source==='moon'||step===2&&action.type==='rotate'||step===3&&action.type==='reflect'||step===5&&action.type==='place'&&action.socket==='below'||step===6&&action.type==='setPulse'&&action.time===12||step===7&&action.type==='run';
}
function advanceTutorial(action) {

 // Campaign metadata belongs only to the saved game, including after a successful training replay.
 puzzle.completed=0;puzzle.unlocked=0;
}

function formatDuration(ms){const seconds=Math.floor(Math.max(0,ms)/1000);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}

function rankingSession(){try{return JSON.parse(localStorage.getItem(RANK_SESSION_KEY)||'null');}catch{return null;}}

async function rankRequest(path,body,token){
 if(!/^https?:$/.test(location.protocol))throw new RoomRequestError('file_origin');
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
 try{const response=await fetch('/api/leaderboard'+path,{method:body?'POST':'GET',headers:{...(token?{Authorization:'Bearer '+token}:{}),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,signal:controller.signal,cache:'no-store'});const data=await response.json();if(!response.ok)throw new RoomRequestError(data.error||'service_unavailable',response.status);return data;}catch(error){if(error instanceof RoomRequestError)throw error;throw new RoomRequestError('network');}finally{clearTimeout(timer);}
}
async function loadRankings(){
 get('ranking-status').textContent=lang().rankingLoading;get('ranking-rows').replaceChildren();
 document.querySelectorAll('[data-rank-kind]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.rankKind===rankKind)));
 try{const data=await rankRequest('?kind='+rankKind);const rows=data.entries.map((entry,index)=>{const row=document.createElement('tr');for(const text of [index+1,entry.name,entry.cleared+' / 5',formatDuration(entry.elapsedMs)]){const td=document.createElement('td');td.textContent=text;row.append(td);}return row;});get('ranking-rows').replaceChildren(...rows);get('ranking-status').textContent=rows.length?'':lang().rankingEmpty;}catch(error){get('ranking-status').textContent=errorText(error.key);}
}

 try{const saved=resume?rankingSession():null;const data=saved?await rankRequest('/runs/'+saved.id,null,saved.token):await rankRequest('/runs',{name});saveSoloProgress();if(!ranked)savedRankedSolo=structuredClone(puzzle);ranked={token:saved?.token||data.token,run:data.run,busy:false};puzzle=structuredClone(data.run.puzzle);rememberNickname();rememberRanked();resetPersonalViews();soloOutcomeShown=false;get('ranking-notice').textContent='';showGame();}catch(error){get('ranking-notice').textContent=errorText(error.key);}finally{get('start-ranked').disabled=false;get('resume-ranked').disabled=false;}

async function rankedAction(action){
 if(ranked.busy)return;const active=ranked;active.busy=true;renderGame();
 try{let data;try{data=await rankRequest('/runs/'+active.run.id,{action,expectedRevision:active.run.revision},active.token);}catch(error){if(error.status===409){data=await rankRequest('/runs/'+active.run.id,null,active.token);actionNotice='stale_revision';}else throw error;}
 if(ranked!==active)return;const changed=puzzleIdentity(puzzle)!==puzzleIdentity(data.run.puzzle);active.run=data.run;puzzle=structuredClone(data.run.puzzle);rememberRanked();if(changed){resetPersonalViews();soloOutcomeShown=false;if(get('modal').open)get('modal').close();}if(action.type==='run')beginReplay();else stopReplay();

const timeText = value => '20:' + String(Math.floor(value)).padStart(2,'0');
const directionKey = ray => ray.dx>0?'right':ray.dx<0?'left':ray.dy<0?'up':'down';
const directionArrow = ray => ({up:'↑',down:'↓',left:'←',right:'→'})[directionKey(ray)];
const beamText = ray => ray ? lang()[ray.color]+' '+directionArrow(ray) : lang().empty;
function previewRay(ray) {
 const pairs=[[-ray.dy,-ray.dx],[ray.dy,ray.dx],[ray.dx,-ray.dy],[-ray.dx,ray.dy]];
 const [dx,dy]=pairs[puzzle.mirror];
 return {...ray,dx,dy};
}

function performPuzzleAction(action) {
 if(roomControlsLocked())return;actionNotice=null;
 if(connection){roomAction('puzzle',{action});return;}
 if(ranked){rankedAction(action);return;}
 if(tutorial&&action.type==='restart'){tutorial.step=0;puzzle=LightPuzzle.initialPuzzle();resetPersonalViews();soloOutcomeShown=false;stopReplay();renderGame();return;}
 if(!tutorialAllows(action))return;
 try{const old=puzzleIdentity(puzzle);puzzle=LightPuzzle.applyPuzzleAction(puzzle,action);if(old!==puzzleIdentity(puzzle)||action.type==='restart'){resetPersonalViews();soloOutcomeShown=false;if(get('modal').open)get('modal').close();}advanceTutorial(action);saveSoloProgress();if(action.type==='run')beginReplay();else stopReplay();}catch(error){actionNotice=error.code||'invalid_action';}renderGame();
}
function stopReplay(){replay={playing:false,time:replayBounds().start,startedAt:0};requestDraw();}
function beginReplay(){if(!puzzle.attempt)return;const b=replayBounds();sceneIndex=1;replay={playing:!reducedMotion,time:reducedMotion?b.end:b.start,startedAt:performance.now()};renderGame();requestDraw();if(reducedMotion)finishReplay();}
function finishReplay(){replay.playing=false;replay.time=replayBounds().end;renderGame();if(tutorial)return;if(connection)showRoomResult();else if(puzzle.solved&&phase==='game'&&!soloOutcomeShown&&!get('modal').open){soloOutcomeShown=true;showModal('solved');}}
function renderReplay(){
 const t=lang(),attempt=puzzle.attempt,log=get('replay-events'),b=replayBounds();get('replay-clock').textContent=timeText(replay.time);get('playback').min=b.start;get('playback').max=b.end;get('playback').value=replay.time;get('playback').disabled=!attempt;get('replay').disabled=!attempt||replay.playing;
 get('time-ticks').textContent=timeText(b.start)+' — '+timeText(b.end);
 const events=attempt?.trace||[];
 if(log.dataset.signature!==JSON.stringify(events)+language){const rows=events.map(event=>{const row=document.createElement('li');row.dataset.at=event.at;const time=document.createElement('time');time.textContent=timeText(event.at);row.append(time,document.createTextNode((event.socket?t[event.socket]+' · ':'')+(t.trace[event.textKey]||event.textKey)));return row;});log.replaceChildren(...rows);log.dataset.signature=JSON.stringify(events)+language;}
 for(const row of log.children)row.toggleAttribute('data-future',Number(row.dataset.at)>replay.time);
 let text=!attempt?t.replayReady:replay.playing?t.replayRunning:t.results[attempt.reason]||attempt.reason;
 if(attempt&&!replay.playing)text+=' '+(attempt.targetResults||[]).map(r=>t[r.socket]+' '+(r.matched?'✓':'×')+' '+timeText(r.signalAt)+' / '+timeText(r.arrival)).join(' · ');
 get('replay-summary').textContent=text;
}
function renderGame(){
 const t=lang(),config=puzzleConfig(),locked=roomControlsLocked()||puzzle.solved,host=canChangeLevel();
 get('chapter-title').textContent=[t.observatory,t.starbridge,t.mirrorDock][sceneIndex];get('case-status').textContent=puzzle.solved?t.stateSolved:t.stateEditing;

 if(sceneIndex===0){const source=sources.find(v=>Math.hypot(v.x-p.x,v.y-p.y)<v.r+35);return source?{type:'capture',source:source.source}:null;}
 if(sceneIndex===2)return Math.hypot(p.x-mirrorPoint.x,p.y-mirrorPoint.y)<112?{type:'rotate'}:null;
 for(const socket of Object.keys(socketOffsets)){const v=socketPosition(socket);if(Math.hypot(v.x-p.x,v.y-p.y)<57){if(puzzle.beam)return {type:'place',socket};if(puzzle.sockets[socket])return {type:'remove',socket};}}
 return null;
}
function updateView(values){Object.assign(view(),values);view().x=clamp(view().x,170,1366);view().y=clamp(view().y,170,854);get('lens-size').value=view().r;requestDraw();}
get('modal').addEventListener('close',()=>{
 const reset=modalType==='solved'&&get('modal').returnValue==='reset';
 const next=modalType==='solved'&&get('modal').returnValue==='next';
 modalType=null;
 get('modal').returnValue='';
 if(next){stageChange({type:'next'});
 }else if(reset){
  if(connection)roomAction('reset');else resetSolo();
 }else if(connection){
  showRoomResult();
 }
});
get('home-btn').onclick=()=>{if(ranked)exitRanked();const code=connection?.code;detachRoom();stopReplay();showHome();if(code)openLobby(code,false);};
get('begin').onclick=()=>enterSolo();get('help').onclick=()=>showModal('guide');get('lang').onclick=()=>{language=language==='zh'?'en':'zh';setSession(LANGUAGE_KEY,language);applyLanguage();};
get('open-tutorial').onclick=startTutorial;get('home-tutorial').onclick=startTutorial;
get('tutorial-welcome-start').onclick=()=>closeTutorialWelcome(true);get('tutorial-welcome-skip').onclick=()=>closeTutorialWelcome(false);
get('tutorial-welcome').addEventListener('cancel',event=>{event.preventDefault();closeTutorialWelcome(false);});
get('tutorial-locate').onclick=locateTutorialControl;get('tutorial-skip').onclick=()=>endTutorial();get('tutorial-finish').onclick=()=>{if(tutorial?.step===8&&!replay.playing)endTutorial('completed');};
get('open-lobby').onclick=()=>openLobby();get('room-code').oninput=e=>{e.target.value=e.target.value.toUpperCase();lobbyNotice=null;renderLobby();};get('room-create').onclick=()=>submitRoom('create');get('room-form').onsubmit=e=>{e.preventDefault();submitRoom('join');};get('room-leave').onclick=leaveRoom;
get('room-reset').onclick=()=>{if(isHost()&&!roomControlsLocked()&&confirm(roomText().resetConfirm))roomAction('reset');};get('copy-invite').onclick=copyRoomInvite;get('invite-link').onclick=e=>e.target.select();
get('scene-tabs').onclick=e=>{const button=e.target.closest('[data-scene]');if(button)selectScene(Number(button.dataset.scene));};
get('source-controls').onclick=e=>{const source=e.target.closest('[data-source]')?.dataset.source;if(source)performPuzzleAction({type:'capture',source});};
get('rotate-mirror').onclick=()=>performPuzzleAction({type:'rotate'});get('reflect-beam').onclick=()=>performPuzzleAction({type:'reflect'});
get('socket-grid').onclick=e=>{const socket=e.target.closest('[data-socket]')?.dataset.socket;if(socket)performPuzzleAction({type:puzzle.beam?'place':'remove',socket});};
get('pulse-schedules').onclick=e=>{const button=e.target.closest('[data-pulse]');if(button)performPuzzleAction({type:'setPulse',time:Number(button.dataset.pulse),...(button.dataset.pulseSocket?{socket:button.dataset.pulseSocket}:{})});};
get('run').onclick=()=>puzzle.solved?beginReplay():performPuzzleAction({type:'run'});get('replay').onclick=beginReplay;get('reset-solo').onclick=resetSolo;
get('lens-size').oninput=e=>updateView({r:Number(e.target.value)});get('reset-view').onclick=()=>{lensViews[sceneIndex]=freshViews()[sceneIndex];updateView({});};get('hint').onclick=()=>{hintLevels[sceneIndex]=Math.min(3,hintLevels[sceneIndex]+1);renderGame();};
get('playback').oninput=e=>{replay.playing=false;replay.time=Number(e.target.value);renderGame();};
canvas.addEventListener('pointerdown',e=>{if(drag)return;e.preventDefault();canvas.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);drag={id:e.pointerId,start:pointInScene(e),x:view().x,y:view().y,target:deviceAt(pointInScene(e)),moved:false};});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=pointInScene(e);if(Math.hypot(p.x-drag.start.x,p.y-drag.start.y)>12)drag.moved=true;if(drag.moved)updateView({x:drag.x+p.x-drag.start.x,y:drag.y+p.y-drag.start.y});});
canvas.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const action=!drag.moved?drag.target:null;drag=null;if(action&&!puzzle.solved)performPuzzleAction(action);});
for(const type of ['pointercancel','lostpointercapture'])canvas.addEventListener(type,()=>{drag=null;});
canvas.addEventListener('keydown',e=>{const key={ArrowLeft:[-24,0],ArrowRight:[24,0],ArrowUp:[0,-24],ArrowDown:[0,24]}[e.key];if(key){e.preventDefault();updateView({x:view().x+key[0],y:view().y+key[1]});}});

get('campaign-bar').onclick=e=>{const button=e.target.closest('[data-level]');if(button)stageChange({type:'startLevel',index:Number(button.dataset.level)});};
get('campaign-mode').onclick=()=>switchMode('campaign');get('challenge-mode').onclick=()=>switchMode('challenge');get('new-challenge').onclick=()=>stageChange({type:'newChallenge',seed:randomSeed()});
get('home-campaign').onclick=()=>enterSolo('campaign');get('home-challenge').onclick=()=>enterSolo('challenge');get('next-level').onclick=()=>stageChange({type:'next'});
get('epoch-panel').onclick=e=>{const button=e.target.closest('[data-epoch]');if(button)performPuzzleAction({type:'setEpoch',epoch:button.dataset.epoch});};
get('route-panel').onclick=e=>{const button=e.target.closest('[data-route]');if(button)performPuzzleAction({type:'setRoute',route:button.dataset.route});};
get('player-name').onchange=rememberNickname;get('open-rankings').onclick=openRankings;get('refresh-rankings').onclick=loadRankings;
document.querySelectorAll('[data-rank-kind]').forEach(button=>button.onclick=()=>{rankKind=button.dataset.rankKind;loadRankings();});
get('start-ranked').onclick=()=>startRanked();get('resume-ranked').onclick=()=>startRanked(true);get('exit-ranked').onclick=()=>{exitRanked();showHome();};
try{get('player-name').value=localStorage.getItem(PROFILE_KEY)||'';}catch{}
setInterval(()=>{if(phase==='game')renderRanked();},1000);

function showReadyGame(){paintCover();get('loading').hidden=true;showHome();const invited=new URL(location.href).searchParams.get('room');if(invited===null)return;const code=invited.trim().toUpperCase();if(!ROOM_CODE.test(code)){lobbyNotice='invalid_room_code';openLobby('',false);}else{openLobby(code,false);const saved=storedRoom(code);if(saved){get('room-name').value=saved.name||'';submitRoom('join');}}}
get('loading').textContent=language==='zh'?'正在读取星港记忆…':'Loading starport memories…';
let loadedScenes=0;for(const [index,image]of scenes.entries()){image.onload=()=>{loadedScenes++;if(loadedScenes===scenes.length)showReadyGame();};image.onerror=()=>{get('loading').textContent=language==='zh'?'场景未能载入，请重新打开完整游戏文件。':'A scene could not load. Reopen the complete game file.';};image.src=ART[index];}
</script>
</body>
